<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8795ff"/>
      <stop offset="0.55" stop-color="#7b5cf0"/>
      <stop offset="1" stop-color="#5b3fd0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59"/>
      <stop offset="0.55" stop-color="#ff5c8a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#cfc8f2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tiny" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="240" fill="url(#gloss)"/>
    <circle cx="470" cy="460" r="190" fill="#ffffff" opacity="0.07"/>
  </g>

  <g transform="rotate(-8 256 262)">
    <!-- shadow of the page -->
    <path d="M144 96 H368 Q382 96 382 110 V364 L306 440 H144 Q130 440 130 426 V110 Q130 96 144 96 Z"
          fill="#1b1250" opacity="0.45" transform="translate(10 16)" filter="url(#soft)"/>
    <!-- the page, with its lower right corner turned up -->
    <path d="M144 84 H368 Q382 84 382 98 V352 L306 428 H144 Q130 428 130 414 V98 Q130 84 144 84 Z" fill="#fffdf7"/>
    <!-- the turned corner -->
    <path d="M382 352 L306 428 L306 352 Z" fill="#1b1250" opacity="0.28" transform="translate(3 4)" filter="url(#tiny)"/>
    <path d="M382 352 L306 428 L306 352 Z" fill="url(#flap)"/>
    <!-- a few lines of text -->
    <g fill="#d9d4ee">
      <rect x="164" y="128" width="170" height="14" rx="7"/>
      <rect x="164" y="162" width="190" height="14" rx="7"/>
      <rect x="164" y="196" width="120" height="14" rx="7"/>
    </g>
  </g>

  <!-- the capricious flourish -->
  <path d="M96 372 C170 262 262 330 242 252 C226 190 150 214 184 282 C214 340 336 312 420 168"
        fill="none" stroke="#2a1a6e" stroke-opacity="0.35" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"
        transform="translate(5 8)" filter="url(#tiny)"/>
  <path d="M96 372 C170 262 262 330 242 252 C226 190 150 214 184 282 C214 340 336 312 420 168"
        fill="none" stroke="url(#ink)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="436" cy="146" r="17" fill="#ffd27a"/>
  <circle cx="436" cy="146" r="17" fill="none" stroke="#ff9a3c" stroke-width="5"/>
</svg>
